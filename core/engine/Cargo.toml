[package]
name = "boa_engine"
keywords = ["javascript", "js", "compiler", "lexer", "parser"]
categories = ["parser-implementations", "compilers"]
readme = "../../README.md"
# Explicit values to avoid workspace inheritance issues when used as nested submodule
description = "Boa is a Javascript lexer, parser and compiler written in Rust."
version = "1.0.0-dev"
edition = "2024"
authors = ["boa-dev"]
license = "Unlicense OR MIT"
repository = "https://github.com/boa-dev/boa"
rust-version = "1.91.0"

[features]
default = ["float16", "xsum", "native", "temporal"]

# Native build - includes wasmtime and native networking
native = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:wasmparser",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:reqwest",
    "dep:webrtc",
]

# WASM build - excludes native-only dependencies
wasm = []

embedded_lz4 = ["boa_macros/embedded_lz4", "lz4_flex"]

# Replace the NaN-boxing implementation of `JsValueInner` with an
# enum-based implementation. This implementation is less performant
# but compatible with more platforms.
# If you encounter the "assertion left == right failed: Pointer is
# not 4-bits aligned or over 51-bits." error, try this feature.
# For more details, see https://github.com/boa-dev/boa/issues/4275
# Disabled by default.
jsvalue-enum = []
deser = ["boa_interner/serde", "boa_ast/serde"]
either = ["dep:either", "boa_gc/either"]

# WebAssembly API support is now always enabled

# Enables the `Intl` builtin object and bundles a default ICU4X data provider.
# Prefer this over `intl` if you just want to enable `Intl` without dealing with the
# generation of ICU4X data.
intl_bundled = ["intl", "dep:boa_icu_provider"]

# Enables Boa's `Intl` builtin implementation.
# Prefer this over `intl_bundled` if you want to reduce the size of the final binary
# by providing a smaller ICU4X data provider.
intl = [
    "boa_gc/icu",
    "icu_normalizer/serde",
    "dep:icu_locale",
    "dep:icu_datetime",
    "dep:icu_plurals",
    "dep:icu_provider",
    "dep:icu_calendar",
    "dep:icu_collator",
    "dep:icu_casemap",
    "dep:icu_list",
    "dep:icu_segmenter",
    "dep:icu_decimal",
    "dep:writeable",
    "dep:sys-locale",
    "dep:yoke",
    "dep:zerofrom",
    "dep:fixed_decimal",
    "dep:tinystr",
]

fuzz = ["boa_ast/arbitrary", "boa_interner/arbitrary"]

# Enable Boa's VM instruction flowgraph generator.
flowgraph = []

# Enable Boa's VM instruction tracing.
trace = ["js"]

# Enable Boa's additional ECMAScript features for web browsers.
annex-b = ["boa_ast/annex-b", "boa_parser/annex-b"]

# Enable Boa's Temporal proposal implementation
temporal = ["dep:icu_calendar", "dep:temporal_rs", "dep:iana-time-zone", "dep:timezone_provider", "timezone_provider/tzif"]

# Enable experimental features, like Stage 3 proposals.
experimental = []

# Enable binding to JS APIs for system related utilities.
js = ["dep:web-time", "dep:getrandom", "getrandom/wasm_js", "time/wasm-bindgen"]

# Enable support for Float16 typed arrays
float16 = ["dep:float16"]

# Enable support for `Math.sumPrecise`
xsum = ["dep:xsum"]

# Native Backtraces
native-backtrace = []

[dependencies]
tag_ptr = { path = "../../utils/tag_ptr" }
boa_interner = { path = "../interner" }
boa_gc = { path = "../gc", features = ["thin-vec", "boa_string"] }
boa_macros = { path = "../macros" }
boa_ast = { path = "../ast" }
boa_parser = { path = "../parser" }
boa_string = { path = "../string" }
cow-utils = "0.1.3"
futures-lite = "2.6.1"
base64 = "0.22"
float16 = { version = "0.1", optional = true }
lz4_flex = { version = "0.12.0", optional = true }
xsum = { version = "0.1.6", optional = true }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.145"
rand = "0.9.2"
num-traits = "0.2.19"
regress = { version = "0.10.5", features = ["utf16"] }
rustc-hash = { version = "2.1.1", features = ["std"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-integer = "0.1.46"
bitflags = "2.10.0"
indexmap = { version = "2.12.0", features = ["std"] }
ryu-js = "1.0.2"
fast-float2 = "0.2.3"
tap = "1.0.1"
small_btree = { path = "../../utils/small_btree" }
paste = "1.0"
thiserror = { version = "2.0.17", default-features = false }
dashmap = "6.1.0"
num_enum = "0.7.5"
thin-vec = "0.2.14"
itertools = { version = "0.14.0", default-features = false }
icu_normalizer = { version = "2.1.1", features = [
    "compiled_data",
    "utf16_iter",
] }
portable-atomic = "1.11.0"
bytemuck = { version = "1.24.0", default-features = false, features = ["derive"] }
arrayvec = "0.7.6"
intrusive-collections = "0.9.7"

# Worker implementation dependencies already included above
cfg-if = "1.0.4"
time = { version = "0.3.44", features = ["local-offset", "formatting", "parsing", "macros"] }
hashbrown = "0.16.0"
either = { version = "1.15.0", optional = true }
static_assertions = "1.1.0"
futures-channel = "0.3.31"
aligned-vec = "0.6.4"

# WebAssembly runtime - Complete implementation with wasmtime (native only)
wasmtime = { version = "21.0", features = ["component-model", "async", "runtime", "cranelift", "cache", "pooling-allocator"], optional = true }
wasmtime-wasi = { version = "21.0", optional = true }
wasmparser = { version = "0.121", optional = true }

# WebSocket and Fetch deps (native only for tokio/reqwest)
tokio = { version = "1.0", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.20", features = ["native-tls"], optional = true }
futures-util = "0.3"
url = "2.4"
reqwest = { version = "0.11", features = ["json", "stream"], optional = true }
scraper = "0.20"
bytes = "1.5"

# WebRTC API deps - Real WebRTC implementation with full P2P networking (native only)
webrtc = { version = "0.10", optional = true }
anyhow = "1.0"

# Worker API deps
crossbeam-channel = "0.5"

# VFS for File System API and IndexedDB persistence
vfs = { path = "../../../../vfs", default-features = false }

# intl deps
boa_icu_provider = { path = "../icu_provider", features = ["std"], optional = true }
sys-locale = { version = "0.3.2", optional = true }
icu_provider = { version = "2.1.1", optional = true }
icu_locale = { version = "2.1.1", default-features = false, features = [
    "serde",
], optional = true }
icu_datetime = { version = "2.1.1", default-features = false, features = [
    "serde",
], optional = true }
icu_calendar = { version = "2.1.1", default-features = false, optional = true }
icu_collator = { version = "2.1.1", default-features = false, features = [
    "serde",
], optional = true }
icu_plurals = { version = "2.1.1", default-features = false, features = [
    "serde",
    "experimental",
], optional = true }
icu_list = { version = "2.1.1", default-features = false, features = [
    "serde",
    "alloc",
], optional = true }
icu_casemap = { version = "2.1.1", default-features = false, features = [
    "serde",
], optional = true }
icu_segmenter = { version = "2.1.1", default-features = false, features = [
    "auto",
    "serde",
], optional = true }
icu_decimal = { version = "2.1.1", default-features = false, features = [
    "serde",
], optional = true }
writeable = { version = "0.6.2", optional = true }
yoke = { version = "0.8.1", optional = true }
zerofrom = { version = "0.1.6", optional = true }
fixed_decimal = { version = "0.7.1", features = [
    "ryu",
], optional = true }
tinystr = { version = "0.8.2", optional = true }
dynify = "0.1.2"
futures-concurrency = "7.6.3"

# temporal deps
temporal_rs = { version = "0.1.2", default-features = false, features = ["float64_representable_durations"], optional = true }
timezone_provider = { version = "0.1.2", optional = true }
iana-time-zone = { version = "0.1.64", optional = true }

[target.'cfg(all(target_family = "wasm", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies]
web-time = { version = "1.1.0", default-features = false, optional = true }
# NOTE: This enables the wasm_js required for rand to work on wasm
getrandom = { version = "0.3.4", default-features = false, features = ["wasm_js"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
float-cmp = "0.10.0"
indoc = "2.0.7"
textwrap = "0.16.2"
test-case = "3.3.1"

[target.x86_64-unknown-linux-gnu.dev-dependencies]
jemallocator = "0.5.4"

[lib]
crate-type = ["cdylib", "lib"]
name = "boa_engine"
bench = false

[[bench]]
name = "full"
harness = false


[package.metadata.docs.rs]
all-features = true
